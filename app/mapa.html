<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; }
    </style>
</head>
<body>
<div id="map"></div>
<script>
    var map;
    var marcadorDestino;
    var marcadorUsuario;
    var destino = { lat: -23.5505, lng: -46.6333 };

    // Torna a função global explicitamente para a API do Google encontrar
    window.initMap = function() {
        map = new google.maps.Map(document.getElementById("map"), {
            zoom: 15,
            center: destino,
        });
        marcadorDestino = new google.maps.Marker({
            position: destino,
            map: map,
            title: "Destino"
        });
    };

    function updateLocation(lat, lng) {
        var origem = { lat: lat, lng: lng };
        if (marcadorUsuario) {
            marcadorUsuario.setMap(null);
        }
        marcadorUsuario = new google.maps.Marker({
            position: origem,
            map: map,
            title: "Você está aqui",
            // Ajustado para https:// para evitar bloqueios de segurança
            icon: "https://maps.google.com/mapfiles/ms/icons/blue-dot.png"
        });

        // Ajusta o zoom para mostrar tanto o usuário quanto o destino
        var bounds = new google.maps.LatLngBounds();
        bounds.extend(destino);
        bounds.extend(origem);
        map.fitBounds(bounds);
    }
</script>
<script
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBfBOli9AgaAFouOEzcp3UtwwXW6h4hUBk&callback=initMap"
        async defer></script>
</body>
</html>
